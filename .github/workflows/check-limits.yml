name: check-limits
# Temporary: measures the default-of-place limit guess on the whole France extract (no upload).
on:
  push:
    branches: [claude/elegant-bardeen-203fg4]
    paths: [.github/workflows/check-limits.yml, pipeline/build_roads.py]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: |
          sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
          pip install -q -r pipeline/requirements.txt
          curl -sSL --fail --retry 3 --retry-delay 30 -o france.osm.pbf https://download.geofabrik.de/europe/france-latest.osm.pbf
          osmium tags-filter france.osm.pbf w/highway n/highway=speed_camera r/type=enforcement \
            wr/landuse=residential,retail,commercial -o drive.osm.pbf
          rm france.osm.pbf
          python pipeline/build_roads.py drive.osm.pbf out --check
