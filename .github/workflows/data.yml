name: data

# Weekly: rebuilds the speed-limit road tiles and the OSM radar extract from the France OSM
# extract, then radars.json. Everything is an asset of the "data" release (never marked latest,
# so the APK link keeps pointing to the app release). radars.yml refreshes radars.json daily.
# Built-up areas (landuse) are kept in the extract: roads without a limit get 50 / 80 from them
# where it is clear (see build_roads.py), and the log checks that rule against the tagged roads.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  # Road tiles and OSM radars: only this workflow publishes them, so no shared group. In the
  # data-release group, a run waiting behind radars.yml was cancelled by its next run (GitHub keeps
  # a single waiting run per group, 13/11/2026), and the week's tiles were lost.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: data-tiles
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
          pip install -q -r pipeline/requirements.txt

      - name: France extract
        run: |
          mkdir -p out
          curl -sSL --fail --retry 3 --retry-delay 30 -o france.osm.pbf https://download.geofabrik.de/europe/france-latest.osm.pbf
          osmium tags-filter france.osm.pbf w/highway n/highway=speed_camera r/type=enforcement \
            wr/landuse=residential,retail,commercial -o drive.osm.pbf
          rm france.osm.pbf
          ls -la drive.osm.pbf

      - name: OSM radars
        run: python pipeline/build_radars.py osm drive.osm.pbf out/osm_radars.json

      - name: Road tiles
        run: |
          python pipeline/build_roads.py drive.osm.pbf out/tiles
          python - <<'PY'
          import json, os, datetime
          tiles = sorted(os.listdir("out/tiles"))
          manifest = {
              "v": 1,
              # Tile content version: raising it makes the app drop its cached tiles once.
              # 2 = limits from built-up areas (src 3).
              "schema": 2,
              "generated": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "tiles": {t: os.path.getsize(f"out/tiles/{t}") for t in tiles},
          }
          json.dump(manifest, open("out/manifest.json", "w"), separators=(",", ":"))
          print(len(tiles), "tiles,", sum(manifest["tiles"].values()) // 1_000_000, "MB")
          PY

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view data >/dev/null 2>&1; then
            gh release create data --title "Données Zenith" --prerelease --latest=false \
              --notes "Radars (data.gouv.fr et radars.securite-routiere.gouv.fr, Licence Ouverte + OpenStreetMap, ODbL + Lufop) et limitations de vitesse (OpenStreetMap, ODbL). Mis à jour automatiquement."
          fi
          gh release upload data out/osm_radars.json --clobber
          ls out/tiles/*.json.gz | xargs -n 50 gh release upload data --clobber
          gh release upload data out/manifest.json --clobber

  # After the tiles, from what they published: a merge without any official source must not cost
  # the week's road tiles. Shared with radars.yml (both publish radars.json and official.json); if
  # a radars run replaces this one while it waits, that run merges the new OSM radars itself.
  radars:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: data-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Radars
        env:
          GH_TOKEN: ${{ github.token }}
          LUFOP_DB_KEY: ${{ secrets.LUFOP_DB_KEY }}
        run: |
          mkdir -p out
          assets=$(gh release view data --json assets -q '.assets[].name' 2>/dev/null || true)
          gh release download data -p osm_radars.json -p manifest.json -D out
          if grep -qx radars.json <<< "$assets"; then gh release download data -p radars.json -O out/previous_radars.json; fi
          if grep -qx official.json <<< "$assets"; then gh release download data -p official.json -D out; fi
          pipeline/lufop_db.sh fetch out/lufop.json
          python pipeline/build_radars.py merge out/osm_radars.json out/lufop.json out/radars.json out/official.json --france out/manifest.json --abroad out/radars_abroad.json

      - name: Publish radars
        if: hashFiles('out/radars.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python pipeline/build_radars.py check out/previous_radars.json out/radars.json --france out/manifest.json
          gh release upload data out/radars.json out/official.json $(ls out/radars_abroad.json 2>/dev/null) --clobber

  # Revives the radars chain (radars.yml starts itself again every few hours) if it ever stopped,
  # whatever came of the jobs above.
  alive:
    needs: [build, radars]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Radars chain alive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A run left "queued" for ever by GitHub, without any job, does not count (see radars.yml).
          alive='select(.status != "completed") | select(.status == "in_progress" or ((.createdAt | fromdateiso8601) > (now - 10800)))'
          busy=$(gh run list --workflow radars.yml --limit 10 --json status,createdAt -q "[.[] | $alive] | length")
          if [ "$busy" = "0" ]; then echo "Chaîne radars arrêtée : relancée."; gh workflow run radars.yml --ref main -f chained=true; fi
