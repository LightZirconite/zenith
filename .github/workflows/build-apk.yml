name: build-apk

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        run: ./gradlew :core:test
      - name: Android 10 API check
        run: ./gradlew :app:lintDebug || { cat app/build/reports/lint-results.txt; exit 1; }
      - name: Android 10 API report
        run: cat app/build/reports/lint-results.txt
      - name: Debug APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: zenith-debug-apk
          path: app/build/outputs/apk/debug/*.apk
