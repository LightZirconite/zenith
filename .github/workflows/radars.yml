name: radars

# Daily: grows our Lufop database within the free quota (secret LUFOP_API_KEY), then merges
# official list + OSM extract + Lufop into radars.json on the "data" release.
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lufop
  cancel-in-progress: false

jobs:
  radars:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Current data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          # A file that exists on the release must download: a transient failure here would
          # restart the Lufop base from zero and overwrite the accumulated one.
          assets=$(gh release view data --json assets -q '.assets[].name' 2>/dev/null || true)
          for f in osm_radars.json lufop.json; do
            if grep -qx "$f" <<< "$assets"; then
              gh release download data -p "$f" -D out
            fi
          done
          ls -la out

      - name: Lufop harvest
        env:
          LUFOP_API_KEY: ${{ secrets.LUFOP_API_KEY }}
        run: python pipeline/harvest_lufop.py out/lufop.json 150

      - name: Merge
        run: |
          if [ -f out/osm_radars.json ]; then
            python pipeline/build_radars.py merge out/osm_radars.json out/lufop.json out/radars.json
          else
            echo "::warning::osm_radars.json absent (workflow data pas encore passé) : radars.json non reconstruit"
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view data >/dev/null 2>&1; then
            gh release create data --title "Données Zenith" --prerelease --latest=false \
              --notes "Radars (data.gouv.fr, Licence Ouverte + OpenStreetMap, ODbL + Lufop) et limitations de vitesse (OpenStreetMap, ODbL). Mis à jour automatiquement."
          fi
          files=""
          for f in out/radars.json out/lufop.json; do test -f "$f" && files="$files $f"; done
          test -n "$files" && gh release upload data $files --clobber
