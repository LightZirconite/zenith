name: radars

# Several times a day, at irregular times: grows our Lufop database within the free quota (secret
# LUFOP_API_KEY), then merges official lists + OSM extract + Lufop into radars.json on the "data"
# release. harvest_lufop.py keeps the calls of the last 24 h in the base, so any number of runs
# never spends more than 150 a day; each run takes a random share of what is left, after a random
# delay, so a missed schedule is caught up and calls never come at fixed times.
# The Lufop base is published encrypted (pipeline/lufop_db.sh, secret LUFOP_DB_KEY).
# GitHub never fired these schedules (0 scheduled run since the workflow exists), so each run also
# starts the next one after a random 3 to 5 h pause ("next" job): the chain keeps itself going, and
# a push of this file or a manual run restarts it if it ever breaks. The same job starts data.yml
# once its data is a week old (its own weekly cron never fired either).
on:
  schedule:
    - cron: "17 1 * * *"
    - cron: "43 5 * * *"
    - cron: "8 9 * * *"
    - cron: "36 13 * * *"
    - cron: "52 17 * * *"
    - cron: "24 21 * * *"
  workflow_dispatch:
    inputs:
      chained:
        description: "Started by the previous run (takes a share of the quota, not all of it)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [.github/workflows/radars.yml]

permissions:
  contents: write
  actions: write

jobs:
  radars:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Shared with data.yml: both publish radars.json and official.json.
    concurrency:
      group: data-release
      cancel-in-progress: false
    steps:
      - name: Random delay
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 2700))

      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Current data
        env:
          GH_TOKEN: ${{ github.token }}
          LUFOP_DB_KEY: ${{ secrets.LUFOP_DB_KEY }}
        run: |
          mkdir -p out
          # A file that exists on the release must download: a transient failure here would
          # restart the Lufop base from zero and overwrite the accumulated one.
          assets=$(gh release view data --json assets -q '.assets[].name' 2>/dev/null || true)
          if grep -qx osm_radars.json <<< "$assets"; then gh release download data -p osm_radars.json -D out; fi
          if grep -qx radars.json <<< "$assets"; then gh release download data -p radars.json -O out/previous_radars.json; fi
          if grep -qx official.json <<< "$assets"; then gh release download data -p official.json -D out; fi
          pipeline/lufop_db.sh fetch out/lufop.json
          ls -la out

      # A manual run spends everything left in the 24-hour budget at once.
      - name: Lufop harvest
        env:
          LUFOP_API_KEY: ${{ secrets.LUFOP_API_KEY }}
        run: python pipeline/harvest_lufop.py out/lufop.json 150 ${{ github.event_name == 'workflow_dispatch' && !inputs.chained && 'all' || '' }}

      # Saved before anything else can fail: today's quota is spent, its results must not be lost.
      - name: Save Lufop base
        env:
          GH_TOKEN: ${{ github.token }}
          LUFOP_DB_KEY: ${{ secrets.LUFOP_DB_KEY }}
        run: |
          if ! gh release view data >/dev/null 2>&1; then
            gh release create data --title "Données Zenith" --prerelease --latest=false \
              --notes "Radars (data.gouv.fr et radars.securite-routiere.gouv.fr, Licence Ouverte + OpenStreetMap, ODbL + Lufop) et limitations de vitesse (OpenStreetMap, ODbL). Mis à jour automatiquement."
          fi
          pipeline/lufop_db.sh publish out/lufop.json

      - name: Merge
        run: |
          if [ -f out/osm_radars.json ]; then
            python pipeline/build_radars.py merge out/osm_radars.json out/lufop.json out/radars.json out/official.json
            python pipeline/build_radars.py check out/previous_radars.json out/radars.json
          else
            echo "::warning::osm_radars.json absent (workflow data pas encore passé) : radars.json non reconstruit"
          fi

      - name: Publish radars
        if: hashFiles('out/radars.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload data out/radars.json out/official.json --clobber

  # Outside the data-release group: its long pause must not hold back data.yml.
  next:
    needs: radars
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Pause
        run: sleep $((10800 + RANDOM % 7200))
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A newer run (manual, push) carries its own chain: this one stops, so chains never multiply.
          newer=$(gh run list --workflow radars.yml --limit 20 --json databaseId,status \
            -q "[.[] | select(.databaseId > ${{ github.run_id }} and .status != \"completed\")] | length")
          if [ "$newer" != "0" ]; then echo "Une exécution plus récente prend le relais."; exit 0; fi
          gh workflow run radars.yml --ref main -f chained=true
          # data.yml (road tiles, OSM radars) depends on a weekly cron that never fired either:
          # started from here once its manifest is a week old and no run of it is under way.
          generated=$(gh release download data -p manifest.json -O - 2>/dev/null | python3 -c "import json,sys; print(json.load(sys.stdin)['generated'])" || echo 1970-01-01T00:00:00+00:00)
          age=$(( $(date +%s) - $(date -d "$generated" +%s) ))
          busy=$(gh run list --workflow data.yml --limit 5 --json status -q '[.[] | select(.status != "completed")] | length')
          if [ "$age" -gt $((7 * 86400)) ] && [ "$busy" = "0" ]; then
            echo "Données OSM vieilles de $((age / 86400)) jours : data.yml relancé."
            gh workflow run data.yml --ref main
          fi
