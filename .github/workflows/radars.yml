name: radars

# Daily: grows our Lufop database within the free quota (secret LUFOP_API_KEY), then merges
# official list + OSM extract + Lufop into radars.json on the "data" release.
# The Lufop base is published encrypted (pipeline/lufop_db.sh, secret LUFOP_DB_KEY).
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lufop
  cancel-in-progress: false

jobs:
  radars:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Current data
        env:
          GH_TOKEN: ${{ github.token }}
          LUFOP_DB_KEY: ${{ secrets.LUFOP_DB_KEY }}
        run: |
          mkdir -p out
          # A file that exists on the release must download: a transient failure here would
          # restart the Lufop base from zero and overwrite the accumulated one.
          if gh release view data --json assets -q '.assets[].name' 2>/dev/null | grep -qx osm_radars.json; then
            gh release download data -p osm_radars.json -D out
          fi
          if gh release view data --json assets -q '.assets[].name' 2>/dev/null | grep -qx radars.json; then
            gh release download data -p radars.json -O out/previous_radars.json
          fi
          pipeline/lufop_db.sh fetch out/lufop.json
          ls -la out

      - name: Lufop harvest
        env:
          LUFOP_API_KEY: ${{ secrets.LUFOP_API_KEY }}
        run: python pipeline/harvest_lufop.py out/lufop.json 150

      # Saved before anything else can fail: today's quota is spent, its results must not be lost.
      - name: Save Lufop base
        env:
          GH_TOKEN: ${{ github.token }}
          LUFOP_DB_KEY: ${{ secrets.LUFOP_DB_KEY }}
        run: |
          if ! gh release view data >/dev/null 2>&1; then
            gh release create data --title "Données Zenith" --prerelease --latest=false \
              --notes "Radars (data.gouv.fr, Licence Ouverte + OpenStreetMap, ODbL + Lufop) et limitations de vitesse (OpenStreetMap, ODbL). Mis à jour automatiquement."
          fi
          pipeline/lufop_db.sh publish out/lufop.json

      - name: Merge
        run: |
          if [ -f out/osm_radars.json ]; then
            python pipeline/build_radars.py merge out/osm_radars.json out/lufop.json out/radars.json
            python pipeline/build_radars.py check out/previous_radars.json out/radars.json
          else
            echo "::warning::osm_radars.json absent (workflow data pas encore passé) : radars.json non reconstruit"
          fi

      - name: Publish radars
        if: hashFiles('out/radars.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload data out/radars.json --clobber
